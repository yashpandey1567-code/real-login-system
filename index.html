<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secure Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, #6d7cff, transparent 35%),
        radial-gradient(circle at bottom right, #8b5cf6, transparent 35%),
        #111827;
      padding: 20px;
    }

    .card {
      width: 400px;
      padding: 38px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .input-box {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .register-title {
      text-align: center;
      color: #111827;
      font-size: 20px;
      margin-bottom: 18px;
    }

    .security {
      text-align: center;
      margin-top: 22px;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (max-width: 450px) {
      .card {
        width: 100%;
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">🔐</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue to your account</p>

    <form action="/login" method="POST">

      <div class="input-box">
        <label>Username</label>
        <input
          type="text"
          name="username"
          placeholder="Enter your username"
          required
        >
      </div>

      <div class="input-box">
        <label>Password</label>
        <input
          type="password"
          name="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit">Sign In</button>

    </form>

    <div class="divider">OR</div>

    <h2 class="register-title">Create an Account</h2>

    <form action="/register" method="POST">

      <div class="input-box">
        <label>Username</label>
        <input
          type="text"
          name="username"
          placeholder="Choose a username"
          required
        >
      </div>

      <div class="input-box">
        <label>Password</label>
        <input
          type="password"
          name="password"
          placeholder="Create a password"
          required
        >
      </div>

      <button type="submit">Create Account</button>

    </form>

    <p class="security">🔒 Your password is securely protected</p>

  </div>

</body>
</html>
